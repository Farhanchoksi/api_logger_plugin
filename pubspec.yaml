name: api_logger_plugin
description: A highly customizable API logger for HTTP and Dio in Dart/Flutter. Features 8 design styles, request/response filtering, and cURL command generation.
version: 1.0.1
homepage: https://github.com/Farhanchoksi/api_logger_plugin
repository: https://github.com/Farhanchoksi/api_logger_plugin

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.6.0
  dio: ^5.9.2

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
